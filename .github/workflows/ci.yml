name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & Test (Windows, MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MSYS2 UCRT64 provides gcc + cmake + ninja on PATH. The previous
      # egor-tensin/setup-mingw@v2 step failed on the bare version '13'.
      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure (Release)
        run: cmake --preset=release

      - name: Build (Release)
        run: ninja -C build

      - name: Run tests (Release)
        run: |
          .\build\bin\fen_test.exe
          .\build\bin\eval_test.exe
          .\build\bin\search_test.exe
          .\build\bin\perft_test.exe 5

      - name: Run bench (depth 6)
        run: .\build\bin\bench.exe 6

      # No ASan/UBSan here: MinGW GCC ships no sanitizer runtimes, so the
      # debug preset cannot link on Windows CI (same as local MinGW).
      # RelWithDebInfo gives a second build configuration instead.
      - name: Configure (RelWithDebInfo)
        run: cmake --preset=relwithdebinfo

      - name: Build (RelWithDebInfo)
        run: ninja -C build-relwithdebinfo

      - name: Run perft (RelWithDebInfo)
        run: .\build-relwithdebinfo\bin\perft_test.exe 4

  clang-tidy:
    name: Clang-Tidy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18
      - name: Run clang-tidy
        run: |
          cmake -B build -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18 -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target clang-tidy || true